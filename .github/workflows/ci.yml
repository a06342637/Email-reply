name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://autoreply:test@127.0.0.1:5432/autoreply?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npx prisma validate
      - run: npx yaml-lint compose.yml
      - run: bash -n install.sh update.sh scripts/autoreply

  docker-smoke:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated CI configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          app_version=$(tr -d '[:space:]' < VERSION)
          instance_key=$(openssl rand -base64 32 | tr -d '\n')
          session_secret=$(openssl rand -hex 32)
          updater_token=$(openssl rand -hex 32)
          cat > .env <<EOF
          NODE_ENV=production
          APP_VERSION=$app_version
          APP_HOST=0.0.0.0
          APP_PORT=3000
          HOST_BIND=127.0.0.1
          HOST_PORT=18080
          PUBLIC_URL=
          DATABASE_URL=postgresql://autoreply:ci-postgres-password@postgres:5432/autoreply?schema=public
          POSTGRES_DB=autoreply
          POSTGRES_USER=autoreply
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_URL=redis://redis:6379
          INSTANCE_KEY=$instance_key
          SESSION_SECRET=$session_secret
          TRUST_PROXY=1
          TZ=Asia/Shanghai
          LOG_LEVEL=info
          BOOTSTRAP_FILE=/bootstrap/admin.json
          WORKER_ID=worker-1
          PROJECT_DIR=$GITHUB_WORKSPACE
          UPDATER_TOKEN=$updater_token
          EOF
          project_name=$(docker compose config --format json | jq -r '.name')
          bootstrap_volume="${project_name}_bootstrap_data"
          docker volume create "$bootstrap_volume"
          docker run --rm -v "$bootstrap_volume:/bootstrap" alpine:3.21 sh -c \
            'printf "%s" "$1" > /bootstrap/admin.json && chmod 0600 /bootstrap/admin.json && chown 10001:10001 /bootstrap/admin.json' \
            _ '{"username":"ci_admin","password":"ci-password-123456","randomUsername":false,"randomPassword":false}'
      - name: Build and start the complete stack
        run: docker compose up -d --build
      - name: Verify readiness and operations CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=false
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:18080/health/live
          curl -fsS http://127.0.0.1:18080/health/ready
          updater_container=$(docker compose ps -q updater)
          test -n "$updater_container"
          test "$(docker inspect "$updater_container" --format '{{.State.Health.Status}}')" = "healthy"
          test "$(docker compose exec -T app autoreply admin show-username)" = "ci_admin"
          docker compose exec -T app autoreply doctor
          index_count=$(docker compose exec -T postgres psql -U autoreply -d autoreply -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname = 'TransactionalOutbox_aggregateId_kind_idx'")
          google_tables=$(docker compose exec -T postgres psql -U autoreply -d autoreply -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('GoogleAppConfig', 'GmailCursor')")
          provider_columns=$(docker compose exec -T postgres psql -U autoreply -d autoreply -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND ((table_name = 'Mailbox' AND column_name = 'provider') OR (table_name = 'OAuthState' AND column_name = 'provider'))")
          microsoft_auth_columns=$(docker compose exec -T postgres psql -U autoreply -d autoreply -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'Mailbox' AND column_name IN ('microsoftAuthMode', 'microsoftClientId')")
          maintenance_failures=$(docker compose exec -T postgres psql -U autoreply -d autoreply -Atc "SELECT count(*) FROM \"SystemLog\" WHERE \"event\" = 'MAINTENANCE_FAILED'")
          test "$index_count" = "1"
          test "$google_tables" = "2"
          test "$provider_columns" = "2"
          test "$microsoft_auth_columns" = "2"
          test "$maintenance_failures" = "0"
      - name: Show container state
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=300 app worker updater migrate postgres redis || true
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans || true
