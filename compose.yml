name: microsoft-mail-autoreply

x-app-common: &app-common
  image: ${AUTOREPLY_IMAGE:-microsoft-mail-autoreply:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      APP_VERSION: ${APP_VERSION:-0.01}
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    image: ${AUTOREPLY_MIGRATION_IMAGE:-microsoft-mail-autoreply-migrate:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  app:
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "apps/api/dist/main.js"]
    volumes:
      - bootstrap_data:/bootstrap
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "apps/api/dist/worker.js"]
    healthcheck:
      test: ["CMD", "node", "apps/api/dist/healthcheck-worker.js"]
      interval: 20s
      timeout: 8s
      retries: 4
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoreply}
      POSTGRES_USER: ${POSTGRES_USER:-autoreply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--save",
        "60",
        "1000",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  bootstrap_data:
